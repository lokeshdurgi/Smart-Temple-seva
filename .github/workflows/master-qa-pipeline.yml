name: Master Enterprise QA Automation Pipeline & Excel Artifact Exporter

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  run-all-4-test-suites:
    name: Execute All 4 Test Suites & Export Excel Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Codebase
        uses: actions/checkout@v4

      - name: 2. Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Python OpenPyXL for Excel Generation
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: 5. Execute Test Suite 1 - Selenium Web Frontend E2E
        run: |
          echo "Running Selenium Web E2E Test Suite..."
          node selenium-tests/tests/login-tests.js || true
          python selenium-tests/generate_excel.py

      - name: 6. Execute Test Suite 2 - Appium Mobile App E2E
        run: |
          echo "Running Appium Mobile App E2E Test Suite..."
          node appium-tests/tests/appium-tests.js || true
          python appium-tests/generate_appium_excel.py

      - name: 7. Execute Test Suite 3 - Security SAST/DAST & Audit
        run: |
          echo "Running DevSecOps Security Audit..."
          python generate_security_excel.py

      - name: 8. Execute Test Suite 4 - Baseline Load & Performance Test (100 VUs / 1 min)
        run: |
          echo "Running Baseline Load Test..."
          node load-tests/baseline-load-test.js || true
          python load-tests/generate_load_test_excel.py

      - name: 9. Bundle All Excel Test Reports
        run: |
          mkdir -p all-excel-reports
          cp selenium-tests/login_test_cases_summary.xlsx all-excel-reports/01_Selenium_Web_Login_Test_Cases.xlsx
          cp appium-tests/appium_test_cases_summary.xlsx all-excel-reports/02_Appium_Mobile_App_Test_Cases.xlsx
          cp "Vulnerability Test Results/endpoint-inventory.xlsx" all-excel-reports/03_Security_Endpoint_Inventory.xlsx
          cp "Vulnerability Test Results/findings.xlsx" all-excel-reports/04_Security_Findings_and_Risk_Summary.xlsx
          cp load-tests/performance_load_test_summary.xlsx all-excel-reports/05_Baseline_Load_Performance_Test_Summary.xlsx
          ls -la all-excel-reports/

      - name: 10. Upload Master Excel Artifact Bundle to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: All-4-Test-Suites-Excel-Reports-Master-Package
          path: all-excel-reports/
          retention-days: 30
